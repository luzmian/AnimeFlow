<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeFlow V0.4.0</title><link rel="stylesheet" href="style.css"></head><body>
<aside><h2>◉ AnimeFlow</h2><nav><button class="active" data-tab="library">▦ 资料库</button><button data-tab="feed">◉ 动态 <i id="dot" hidden></i></button><button data-tab="history">◷ 历史记录</button></nav><small>V0.4.0 · 本地追番</small></aside>
<main><header><div><h1 id="heading">动漫资料库</h1><p id="subtitle">发现每一季的精彩动画</p></div><span id="storageStatus" role="status" class="muted">正在读取本地数据…</span><button id="theme">◐ 主题</button></header>
<section id="library"><div class="filters"><input id="search" placeholder="搜索当前季度动漫名称…"><select id="year"></select><select id="season"><option value="WINTER">冬季 · 1月</option><option value="SPRING">春季 · 4月</option><option value="SUMMER">夏季 · 7月</option><option value="FALL">秋季 · 10月</option></select><select id="format"><option value="">全部类型</option><option value="TV">TV</option><option value="MOVIE">剧场版</option><option value="OVA">OVA</option><option value="ONA">ONA</option><option value="SPECIAL">特别篇</option></select><select id="region" aria-label="地区"><option value="">全部地区</option><option>日本</option><option>中国</option><option>美国</option><option>韩国</option><option>法国</option></select><input id="genre" placeholder="题材标签，如科幻" aria-label="题材"><select id="sort"><option value="POPULARITY_DESC">热门优先</option><option value="SCORE_DESC">评分最高</option><option value="START_DATE_DESC">首播最新</option><option value="UPDATED_DESC">最近更新</option></select><button id="reload">刷新</button></div><div id="notice"></div><p id="updateSortNotice" class="muted" role="status" hidden></p><div id="cards" class="cards"></div><button id="more" hidden>加载更多</button></section>
<section id="feed" hidden><div class="seg"><button data-feed="all">全部 · 放送与新番</button><button class="chosen" data-feed="mine">我的追番</button><button id="feedRefresh">同步记录</button></div><p class="muted">这里展示社区逐集播出记录与预计日程，平台实际上线状态未知。日程不计为已更新。</p><div id="feedNotice" role="status"></div><h3>未来七天 · 预计播出</h3><div id="weekCalendar" class="week-calendar"></div><h3>播出记录</h3><p class="muted">时间按社区提供的播出日期展示；未提供时分秒的记录会标注“时刻未提供”。</p><div id="events"></div><button id="feedMore" hidden>继续加载动态</button><p id="feedEnd" class="muted" role="status"></p></section>
<section id="history" hidden><p class="muted">观看进度按作品和剧集保存在本机。本地视频自动记录进度；刷新后重新选择同一文件即可继续观看。</p><div id="records"></div></section></main>
<div id="shade" hidden></div><section id="drawer" aria-label="动漫详情"><button id="close">✕</button><div id="detail"></div></section><script src="player.js"></script><script src="app.js"></script></body></html>
