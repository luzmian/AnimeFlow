[package]
name = "animeflow"
version = "0.4.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync","time"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
